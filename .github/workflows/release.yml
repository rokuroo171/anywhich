name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
        include:
          - target: x86_64-unknown-linux-musl
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            rustflags: -C linker=aarch64-linux-gnu-gcc
          - target: aarch64-unknown-linux-musl
            # Pure-Rust crate: rust-lld plus rust's self-contained musl
            # objects link a static binary without a cross gcc.
            rustflags: -C linker=rust-lld
          - target: x86_64-pc-windows-gnu
            # Cross-linking windows-gnu from linux: the mingw gcc is the
            # target's default linker, no RUSTFLAGS needed. Same target the
            # CI check job type-checks.
            apt: gcc-mingw-w64-x86-64
            exe: anyw.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tools
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="anywhich-${version}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe || 'anyw' }}" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          # Windows assets ship as zip (the spelling Windows users expect);
          # everything else is a tarball.
          if [ -n "${{ matrix.exe }}" ]; then
            zip -r "$dir.zip" "$dir"
            sha256sum "$dir.zip" > "$dir.zip.sha256"
          else
            tar czf "$dir.tar.gz" "$dir"
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            *.tar.gz
            *.zip
            *.sha256

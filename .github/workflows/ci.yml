name: ci

on:
  push:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

  windows-gnu-check:
    name: check x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # cargo check only type-checks, so no mingw-w64 is needed here.
      # --tests matters: test modules are cfg-gated per platform and a
      # check without them never compiles the windows ones.
      - name: Check
        run: cargo check --tests --target x86_64-pc-windows-gnu --locked

  windows-test:
    name: test on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

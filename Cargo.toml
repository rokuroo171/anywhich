[package]
name = "anywhich"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A which that knows what is on your system"

[dependencies]
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "anyw"
path = "src/main.rs"
